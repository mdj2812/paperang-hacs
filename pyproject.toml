[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/paperang"]
relative_files = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff.lint]
# Pin the rule set explicitly: ruff's default selection is not stable across
# releases, so leaving it open silently changed the CI result on an unchanged
# codebase.
select = ["E4", "E7", "E9", "F"]
# E402: deliberate non-top-level imports due to HA module name conflict
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"custom_components/paperang/__init__.py" = ["F401"]
